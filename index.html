<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moutix Analytics</title>
<meta name="description" content="Moutix Jewelry business analytics dashboard">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Inter,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: light dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* ============================================================
     TOKENS — light first (reference look), dark variant provided
     ============================================================ */
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --surface-2: #f7f9fc;
    --surface-3: #eef2f8;
    --border: #e4e9f2;
    --border-strong: #d4dbe8;
    --text: #172033;
    --text-2: #46536b;
    --muted: #7d8aa3;
    --primary: #2563eb;
    --primary-hover: #1d4fd8;
    --primary-soft: #e8f0fe;
    --primary-ink: #ffffff;

    --good: #12a150; --good-soft: #e6f6ed;
    --warn: #d97706; --warn-soft: #fdf3e3;
    --crit: #dc2626; --crit-soft: #fdeaea;
    --info: #0284c7; --info-soft: #e4f2fb;

    --c1: #2563eb; --c2: #60a5fa; --c3: #0ea5e9; --c4: #1e3a8a;
    --c5: #93c5fd; --c6: #7c3aed;

    --shadow-sm: 0 1px 2px rgba(23,32,51,.05);
    --shadow: 0 1px 3px rgba(23,32,51,.06), 0 8px 20px -12px rgba(23,32,51,.14);

    /* sidebar is navy in both themes */
    --nav: #15213a;
    --nav-2: #1d2b48;
    --nav-line: #263554;
    --nav-text: #9aa8c2;
    --nav-dim: #63739a;
    --nav-active-bg: #2563eb;

    --nav-w: 248px;
    --header-h: 62px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1420; --surface: #141d2c; --surface-2: #182233; --surface-3: #1e293c;
      --border: #243149; --border-strong: #2e3d59;
      --text: #e9eff8; --text-2: #b4c1d6; --muted: #8496b3;
      --primary: #3b82f6; --primary-hover: #60a5fa; --primary-soft: #1b2b48; --primary-ink: #ffffff;
      --good: #34d399; --good-soft: #14302a; --warn: #fbbf24; --warn-soft: #33290f;
      --crit: #f87171; --crit-soft: #351b1d; --info: #38bdf8; --info-soft: #14293b;
      --c1: #3b82f6; --c2: #60a5fa; --c3: #38bdf8; --c4: #818cf8; --c5: #93c5fd; --c6: #a78bfa;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
      --nav: #0f1826; --nav-2: #18233a; --nav-line: #22304a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1420; --surface: #141d2c; --surface-2: #182233; --surface-3: #1e293c;
    --border: #243149; --border-strong: #2e3d59;
    --text: #e9eff8; --text-2: #b4c1d6; --muted: #8496b3;
    --primary: #3b82f6; --primary-hover: #60a5fa; --primary-soft: #1b2b48; --primary-ink: #ffffff;
    --good: #34d399; --good-soft: #14302a; --warn: #fbbf24; --warn-soft: #33290f;
    --crit: #f87171; --crit-soft: #351b1d; --info: #38bdf8; --info-soft: #14293b;
    --c1: #3b82f6; --c2: #60a5fa; --c3: #38bdf8; --c4: #818cf8; --c5: #93c5fd; --c6: #a78bfa;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
    --nav: #0f1826; --nav-2: #18233a; --nav-line: #22304a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4 { margin: 0; font-weight: 600; text-wrap: balance; }
  button, input, select { font-family: inherit; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* ===================== shell ===================== */
  .shell { display: flex; min-height: 100%; }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: var(--nav-w); flex-shrink: 0; background: var(--nav);
    position: sticky; top: 0; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; z-index: 50;
    padding-top: env(safe-area-inset-top, 0px);
    transition: transform .22s ease;
  }
  .brand {
    display: flex; align-items: center; gap: 11px; padding: 18px 20px 16px;
    border-bottom: 1px solid var(--nav-line);
  }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(140deg, #3b82f6, #1d4fd8);
    display: grid; place-items: center; color: #fff;
    font-weight: 800; font-size: 15px; letter-spacing: .02em;
    box-shadow: 0 4px 12px -4px rgba(37,99,235,.7);
  }
  .brand-text .n { color: #fff; font-weight: 700; font-size: 15px; letter-spacing: .09em; line-height: 1.1; }
  .brand-text .s { color: var(--nav-dim); font-size: 9.5px; font-weight: 600; letter-spacing: .1em; line-height: 1.35; margin-top: 3px; }

  .nav-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 18px; }
  .nav-group + .nav-group { margin-top: 14px; }
  .nav-label {
    font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--nav-dim);
    padding: 0 10px 7px; text-transform: uppercase;
  }
  .nav-item {
    width: 100%; display: flex; align-items: center; gap: 11px;
    padding: 9px 11px; border: 0; border-radius: 8px; background: transparent;
    color: var(--nav-text); font-size: 13.5px; font-weight: 500; text-align: left;
    cursor: pointer; margin-bottom: 2px; transition: background .12s, color .12s;
  }
  .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .9; }
  .nav-item:hover { background: var(--nav-2); color: #fff; }
  .nav-item.active { background: var(--nav-active-bg); color: #fff; font-weight: 600; box-shadow: 0 4px 12px -5px rgba(37,99,235,.9); }
  .nav-item.active svg { opacity: 1; }
  .nav-badge {
    margin-left: auto; background: var(--crit); color: #fff; font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 99px; line-height: 1.6;
  }
  .nav-item.active .nav-badge { background: rgba(255,255,255,.25); }

  .nav-foot { padding: 12px 18px calc(14px + env(safe-area-inset-bottom,0px)); border-top: 1px solid var(--nav-line); }
  .nav-source { font-size: 10.5px; color: var(--nav-dim); line-height: 1.5; }
  .nav-source b { color: var(--nav-text); font-weight: 600; }

  .scrim { display: none; }
  @media (max-width: 1080px) {
    .sidebar { position: fixed; left: 0; transform: translateX(-100%); }
    .sidebar.open { transform: none; box-shadow: 24px 0 60px -24px rgba(0,0,0,.55); }
    .scrim.show { display: block; position: fixed; inset: 0; background: rgba(8,12,20,.5); z-index: 49; }
  }

  /* ---------- main + header ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .header {
    position: sticky; top: 0; z-index: 30; background: var(--surface);
    border-bottom: 1px solid var(--border);
    min-height: var(--header-h); display: flex; align-items: center; gap: 14px;
    padding: 10px clamp(14px, 2.2vw, 26px);
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    flex-wrap: wrap;
  }
  .h-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-2); display: grid; place-items: center;
    cursor: pointer; flex-shrink: 0; position: relative; transition: background .12s, border-color .12s;
  }
  .icon-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn .badge {
    position: absolute; top: -5px; right: -5px; background: var(--crit); color: #fff;
    font-size: 9.5px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 99px;
    display: grid; place-items: center; padding: 0 4px; border: 2px solid var(--surface);
  }
  .burger { display: none; }
  @media (max-width: 1080px) { .burger { display: grid; } }

  .page-h { min-width: 0; }
  .page-h .crumb { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .page-h h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; margin-top: 1px; }

  .h-right { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .searchbox { position: relative; }
  .searchbox input {
    width: 190px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 13px;
    padding: 0 10px 0 32px;
  }
  .searchbox input::placeholder { color: var(--muted); }
  .searchbox svg { position: absolute; left: 10px; top: 9px; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
  @media (max-width: 700px) { .searchbox input { width: 130px; } }

  .live-pill {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
    border-radius: 99px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap;
  }
  .live-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .live-pill.live { color: var(--good); background: var(--good-soft); border-color: transparent; }
  .live-pill.live .dot { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .live-pill.stale { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .live-pill.err { color: var(--crit); background: var(--crit-soft); border-color: transparent; }
  @media (prefers-reduced-motion: reduce) { .live-pill.live .dot { animation: none; } }

  .sync-label { font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (max-width: 860px) { .sync-label { display: none; } }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px;
    border: 0; border-radius: 8px; background: var(--primary); color: var(--primary-ink);
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: background .12s;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary svg { width: 14px; height: 14px; }
  .btn-primary.spinning svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .btn-primary.spinning svg { animation: none; } }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(140deg,#3b82f6,#1d4fd8);
    color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
  }

  /* notifications dropdown */
  .dropdown {
    position: absolute; top: calc(100% + 8px); right: 0; width: min(330px, 86vw);
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 6px; z-index: 60; display: none;
  }
  .dropdown.show { display: block; }
  .dropdown h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 9px 10px 7px; }
  .dd-item { display: flex; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13px; line-height: 1.45; }
  .dd-item:hover { background: var(--surface-2); }
  .dd-item .ico { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .dd-item .t { font-weight: 600; }
  .dd-item .s { color: var(--muted); font-size: 12px; }
  .notif-wrap { position: relative; }

  /* ---------- content ---------- */
  .content { padding: 18px clamp(14px, 2.2vw, 26px) 56px; flex: 1; }

  .banner {
    display: none; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.5;
    padding: 11px 14px; border-radius: 10px; margin-bottom: 16px;
    background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
  }
  .banner.show { display: flex; }
  .banner svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

  /* filters */
  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
  }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld label { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .fld select, .fld input {
    height: 32px; min-width: 128px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 12.5px; padding: 0 8px;
  }
  .clear-btn {
    margin-left: auto; height: 32px; padding: 0 12px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--primary);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .clear-btn:hover { background: var(--primary-soft); }
  .filter-count { font-size: 12px; color: var(--muted); align-self: center; }

  /* grid */
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; }
  .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
  @media (max-width: 1180px) { .c3 { grid-column: span 6; } .c4, .c5 { grid-column: span 6; } .c7, .c8 { grid-column: span 12; } }
  @media (max-width: 760px) { .c3, .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; } }

  /* KPI */
  .kpis { display: grid; gap: 12px; margin-bottom: 14px; }
  .kpis.k5 { grid-template-columns: repeat(5, 1fr); }
  .kpis.k4 { grid-template-columns: repeat(4, 1fr); }
  .kpis.kauto { grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); }
  @media (max-width: 1180px) { .kpis.k5, .kpis.k4 { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 760px) { .kpis.k5, .kpis.k4, .kpis.kauto { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .kpis.k5, .kpis.k4, .kpis.kauto { grid-template-columns: 1fr; } }

  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
    padding: 14px 15px 13px; box-shadow: var(--shadow-sm); min-width: 0;
  }
  .kpi .k-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .kpi .k-label { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .k-ico { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); flex-shrink: 0; }
  .kpi .k-ico svg { width: 13px; height: 13px; }
  .kpi .k-val { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-top: 9px; line-height: 1.15; }
  .kpi .k-val.sm { font-size: 16px; }
  .kpi .k-val.good { color: var(--good); } .kpi .k-val.warn { color: var(--warn); } .kpi .k-val.crit { color: var(--crit); }
  .kpi .k-sub { font-size: 11.5px; color: var(--muted); margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
  .kpi .k-sub b { color: var(--text-2); font-weight: 600; }
  .kpi.na .k-val { font-size: 13px; color: var(--muted); font-weight: 600; }

  /* cards */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow-sm); overflow: hidden; height: 100%;
    display: flex; flex-direction: column;
  }
  .card-h {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px 10px; flex-wrap: wrap;
  }
  .card-h h3 { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .card-h .sub { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .card-b { padding: 4px 16px 16px; flex: 1; }
  .card-b.flush { padding: 0 0 0; }

  .tabs { display: inline-flex; gap: 2px; background: var(--surface-3); padding: 3px; border-radius: 8px; }
  .tabs button {
    border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600;
    padding: 5px 11px; border-radius: 6px; cursor: pointer;
  }
  .tabs button.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }

  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 34px 16px; color: var(--muted); font-size: 13px; text-align: center;
  }
  .empty svg { width: 26px; height: 26px; opacity: .45; }

  /* charts */
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { fill: var(--muted); font-family: 'Inter', sans-serif; font-size: 10.5px; }
  .chart .vlabel { fill: var(--text); font-weight: 600; }
  .chart .grid-l { stroke: var(--border); stroke-width: 1; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  .legend b { color: var(--text); font-weight: 600; }

  /* ranking list (reference right panel) */
  .rank-list { display: flex; flex-direction: column; }
  .rank-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-top: 1px solid var(--border); }
  .rank-row:first-child { border-top: 0; }
  .rank-n {
    width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; background: var(--surface-3); color: var(--text-2); flex-shrink: 0;
  }
  .rank-row:nth-child(-n+3) .rank-n { background: var(--nav); color: #fff; }
  .rank-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-sub { font-size: 11px; color: var(--muted); }
  .rank-val { margin-left: auto; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* tables */
  .tbl-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 0 16px 12px; }
  .tbl-tools input[type="search"] {
    height: 32px; flex: 1; min-width: 160px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 12.5px; padding: 0 10px;
  }
  .tbl-wrap { overflow-x: auto; border-top: 1px solid var(--border); }
  table { border-collapse: collapse; width: 100%; min-width: 560px; }
  thead th {
    text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); background: var(--surface-2); padding: 10px 13px; white-space: nowrap;
    cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); position: sticky; top: 0;
  }
  thead th:hover { color: var(--text-2); }
  thead th.sorted { color: var(--primary); }
  thead th .arr { font-size: 8px; margin-left: 3px; }
  tbody td { padding: 11px 13px; font-size: 13px; border-bottom: 1px solid var(--border); white-space: nowrap; color: var(--text-2); }
  tbody td.strong { color: var(--text); font-weight: 600; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover td { background: var(--surface-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.pos { color: var(--good); font-weight: 600; } td.neg { color: var(--crit); font-weight: 600; }

  .chip {

<script>
(function () {

  /* =========================================================

  function cleanCell(c) {

  }
  function parseMarkdownTables(md) {

    var blocks = [], cur = [];

  }
  function buildDashboardMap(tables) {
    var map = {};
    tables.forEach(function (t) {

  function rowsFromAny(v) {

  /* =========================================================

     ========================================================= */
  var STATUS_ORDER = ["Delivered", "Processing", "Cancelled", "Refunded", "RTO", "Exchange"];
  function statusTone(s) {
    var t = String(s || "").toLowerCase();

    if (t.indexOf("process") !== -1 || t.indexOf("ship") !== -1 || t.indexOf("transit") !== -1) return "blue";

    if (alert.indexOf("urgent") !== -1 || alert.indexOf("reorder") !== -1) return { key: "urgent", label: "Urgent Reorder", tone: "crit" };
    if (alert.indexOf("low") !== -1) return { key: "low", label: "Low Stock", tone: "warn" };
    if (alert.indexOf("ok") !== -1 || alert.indexOf("healthy") !== -1) return { key: "healthy", label: "Healthy", tone: "good" };

  /* =========================================================

     ========================================================= */
  var SERIES = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)"];

  function yTicks(max, integer) {
    var step;
    if (integer) {
      step = Math.max(1, Math.ceil((max || 1) / 4));
    } else {

  function columnChart(items, opts) {

  /* ---------- data table ---------- */
  function table(cfg) {
    var id = cfg.id;
    if (!S.tbl[id]) S.tbl[id] = { page: 1, sortKey: cfg.defaultSort || null, dir: cfg.defaultDir || -1, q: "" };
    var st = S.tbl[id];
    var rows = cfg.rows.slice();

    var q = (st.q || "") || (cfg.useGlobalSearch ? S.globalSearch : "");
    if (q) {
      var ql = q.toLowerCase();
      var keys = cfg.searchKeys || cfg.columns.map(function (c) { return c.key; });
      rows = rows.filter(function (r) {
        return keys.some(function (k) { return String(r[k] === undefined ? "" : r[k]).toLowerCase().indexOf(ql) !== -1; });
      });
    }
    if (st.sortKey) {
      var col = cfg.columns.filter(function (c) { return c.key === st.sortKey; })[0] || {};
      rows.sort(function (a, b) {
        var av = a[st.sortKey], bv = b[st.sortKey];
        if (col.num) return (n(av) - n(bv)) * st.dir;
        return String(av === undefined ? "" : av).localeCompare(String(bv === undefined ? "" : bv)) * st.dir;
      });
    }
    var size = cfg.pageSize || 10;
    var pages = Math.max(1, Math.ceil(rows.length / size));
    if (st.page > pages) st.page = pages;
    var slice = rows.slice((st.page - 1) * size, st.page * size);

    var tools = cfg.search === false ? "" :
      '<div class="tbl-tools"><input type="search" data-tsearch="' + id + '" value="' + esc(st.q) + '" placeholder="' + esc(cfg.searchPlaceholder || "Search…") + '"></div>';

    var thead = "<tr>" + cfg.columns.map(function (c) {
      var on = st.sortKey === c.key;
      return '<th class="' + (c.num ? "num " : "") + (on ? "sorted" : "") + '" data-sort="' + id + "" + c.key + '">' +
        esc(c.label) + (on ? '<span class="arr">' + (st.dir === 1 ? "▲" : "▼") + '</span>' : '') + '</th>';
    }).join("") + "</tr>";

    var tbody = slice.length ? slice.map(function (r) {
      return '<tr class="' + (cfg.onClick ? "click" : "") + '"' + (cfg.onClick ? ' data-rid="' + id + "" + r.__i + '"' : '') + '>' +
        cfg.columns.map(function (c) {
          var v = r[c.key];
          var cls = (c.num ? "num " : "") + (c.strong ? "strong " : "");
          if (c.tone) cls += c.tone(v, r) + " ";
          return '<td class="' + cls.trim() + '">' + (c.render ? c.render(v, r) : (has(v) ? esc(v) : "—")) + '</td>';
        }).join("") + '</tr>';
    }).join("") : '<tr><td colspan="' + cfg.columns.length + '">' + emptyBlock(cfg.empty || "No rows match the current filters") + '</td></tr>';

    var pager = rows.length > size ?
      '<div class="pager"><span>' + rows.length + ' rows · page ' + st.page + ' of ' + pages + '</span>' +
      '<button data-pg="' + id + 'prev"' + (st.page <= 1 ? " disabled" : "") + '>Prev</button>' +
      '<button data-pg="' + id + 'next"' + (st.page >= pages ? " disabled" : "") + '>Next</button></div>'
      : '<div class="pager"><span>' + rows.length + (rows.length === 1 ? ' row' : ' rows') + '</span></div>';

    return tools + '<div class="tbl-wrap"><table><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div>' + pager;
  }

  /* =========================================================

  function bucket(orders, gran) {
    var m = {};
    orders.forEach(function (o) {
      if (!has(o.OrderDate)) return;
      var d = String(o.OrderDate).slice(0, 10), key = d;
      if (gran === "monthly") key = d.slice(0, 7);
      else if (gran === "weekly") {
        var dt = new Date(d);
        if (!isNaN(dt.getTime())) {
          var day = (dt.getDay() + 6) % 7;
          var monday = new Date(dt); monday.setDate(dt.getDate() - day);
          key = monday.toISOString().slice(0, 10);
        }
      }
      if (!m[key]) m[key] = { revenue: 0, profit: 0, orders: 0, units: 0, rto: 0, adSpend: 0 };
      m[key].revenue += o.Revenue; m[key].profit += o.NetProfit; m[key].orders += 1;
      m[key].units += o.Qty; m[key].adSpend += o.AdSpend;
      if (isRTO(o)) m[key].rto += 1;
    });
    return Object.keys(m).sort().map(function (k) {
      return { x: k, revenue: m[k].revenue, profit: m[k].profit, orders: m[k].orders, units: m[k].units, rto: m[k].rto, adSpend: m[k].adSpend };
    });
  }
  function byKey(orders, keyFn, nameFn) {
    var m = {};
    orders.forEach(function (o) {
      var k = keyFn(o); if (!has(k)) return;
      if (!m[k]) m[k] = { key: k, name: nameFn ? nameFn(o) : k, revenue: 0, profit: 0, units: 0, orders: 0, rto: 0 };
      m[k].revenue += o.Revenue; m[k].profit += o.NetProfit; m[k].units += o.Qty; m[k].orders += 1;
      if (isRTO(o)) m[k].rto += 1;
    });
    return Object.keys(m).map(function (k) { return m[k]; });
  }
  function statusBreakdown(orders) {
    var m = {};

    var out = STATUS_ORDER.map(function (s, i) {
      var found = Object.keys(m).filter(function (k) { return k.toLowerCase() === s.toLowerCase(); })[0];
      var v = found ? m[found] : 0;

      // Delivered, Processing, Cancelled, Refunded, RTO, Exchange
      return { label: s, value: v, color: [ "var(--good)", "var(--c1)", "var(--warn)", "var(--c6)", "var(--crit)", "var(--c3)" ][i] };

  var P = {};

  P.dashboard = function () {
    var o = fOrders();
    var d = S.dash;
    var revenue = o.length ? sum(o, function (x) { return x.Revenue; }) : n(d["Total Revenue"]);
    var profit = o.length ? sum(o, function (x) { return x.NetProfit; }) : n(d["Net Business Profit"] || d["Total Profit"]);
    var count = o.length || n(d["Total Orders"]);
    var units = o.length ? sum(o, function (x) { return x.Qty; }) : n(d["Total Units Sold"]);
    var aov = safeDiv(revenue, count);
    // order-level ad spend is what the sheet's own Dashboard tab reports; Meta campaign
    // spend is a separate figure and is shown alongside rather than silently added in.
    var adSpend = sum(o, function (x) { return x.AdSpend; });

  // Accept the payload whether the tabs sit at the top level or inside a wrapper.
  function unwrap(json) {
    if (!json || typeof json !== "object") return json;
    var keys = ["Products", "Amazon", "Website Orders", "Meta ads", "Dashboard"];
    function hasTabs(o) { return o && typeof o === "object" && keys.some(function (k) { return o[k] !== undefined; }); }
    if (hasTabs(json)) return json;
    var wrappers = ["data", "result", "payload", "sheets", "tabs", "body"];
    for (var i = 0; i < wrappers.length; i++) if (hasTabs(json[wrappers[i]])) return json[wrappers[i]];
    return json;
  }

  function fetchApi() {
    return new Promise(function (resolve, reject) {
      var callbackName = "__moutix_jsonp_" + Date.now() + "_" + Math.random().toString(36).slice(2);
      var script = document.createElement("script");
      var finished = false;
      var timeout = setTimeout(function () {
        cleanup();
        reject({ kind: "timeout" });
      }, 25000);

      function cleanup() {
        if (finished) return;
        finished = true;
        clearTimeout(timeout);
        try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }

      window[callbackName] = function (json) {
        if (finished) return;
        cleanup();
        try {
          if (!json || json.success !== true) {
            reject({ kind: "api", error: json && json.error ? json.error : "API returned an error" });
            return;
          }
          if (!applyData(unwrap(json), "api")) {
            reject({ kind: "shape" });
            return;
          }
          resolve(true);
        } catch (e) {
          reject({ kind: "parse" });
        }
      };

      script.onerror = function () {
        cleanup();
        reject({ kind: "network" });
      };

      var url = API_URL +
        (API_URL.indexOf("?") === -1 ? "?" : "&") +
        "callback=" + encodeURIComponent(callbackName) +
        (CACHE_BUST ? "&_ts=" + Date.now() : "");

      script.async = true;
      script.src = url;
      document.head.appendChild(script);
    });
  }

  function apiError(e) {
    var kind = e && e.kind;
    var msg;
    if (kind === "html") msg = "The API returned a web page instead of data — that usually means the deployment is not public. In Apps Script: Deploy \u2192 Manage deployments \u2192 edit \u2192 set \u201cWho has access\u201d to \u201cAnyone\u201d, then Deploy again.";
    else if (kind === "http") msg = "The API responded with HTTP " + e.status + ". Check that the /exec URL in this file is the current deployment.";
    else if (kind === "parse") msg = "The API response was not valid JSON. Open the /exec URL in a browser tab to see what it is returning.";
    else if (kind === "shape") msg = "The API replied, but no Products / Amazon / Website Orders / Meta ads / Dashboard keys were found in it. Nothing has been changed \u2014 the dashboard is still showing the last good data.";
    else msg = "Could not reach the API. If you opened this file straight from your computer, host it instead (see the setup notes) \u2014 and confirm the Apps Script deployment is set to \u201cAnyone\u201d.";
    if (S.loaded) { setLive("stale", "LAST KNOWN"); }
    else { setLive("err", "OFFLINE"); render(); }
    setBanner(true, msg);
  }

  function boot() {
    render();
    setLive("", "CONNECTING");

    var inFlight = false;
    function load(manual) {
      if (inFlight) return Promise.resolve();
      inFlight = true;
      if (manual) document.getElementById("refresh").classList.add("spinning");
      if (S.loaded) setLive("stale", "SYNCING");
      return fetchApi().then(function () {
        markSynced(Date.now());
        setLive("live", "LIVE");
        setBanner(false);
        render();
      }).catch(apiError).then(function () {
        inFlight = false;
        stopSpin();
      });
    }

    document.getElementById("refresh").addEventListener("click", function () { load(true); });

    load(false).then(function () {
      // If this file is ever opened inside Claude (direct fetch blocked there),
      // fall back to reading the same spreadsheet through the Drive connector.
      if (!S.loaded && window.claude && window.claude.use) {
        window.claude.use("mcp").then(function (mcp) {
          if (!mcp) return;
          mcp.watchTool(MCP_SERVER, MCP_TOOL, { fileId: SHEET_ID }, handleMcpEvent, { refetchInterval: REFRESH_MS });
        }).catch(function () {});
      }
    });

    setInterval(function () { if (!document.hidden) load(false); }, REFRESH_MS);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) load(false); });
  }

  /* ---------- chrome wiring ---------- */
  document.getElementById("burger").addEventListener("click", function () {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("scrim").classList.add("show");
  });
  document.getElementById("scrim").addEventListener("click", function () {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("scrim").classList.remove("show");
  });
  document.getElementById("drawer-x").addEventListener("click", closeDrawer);
  document.getElementById("ovl").addEventListener("click", closeDrawer);
  document.getElementById("notif-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    document.getElementById("notif-dd").classList.toggle("show");
  });
  document.addEventListener("click", function () { document.getElementById("notif-dd").classList.remove("show"); });
  document.getElementById("notif-dd").addEventListener("click", function (e) { e.stopPropagation(); });
  var gs = document.getElementById("global-search");
  gs.addEventListener("input", function () {
    S.globalSearch = gs.value;
    Object.keys(S.tbl).forEach(function (k) { S.tbl[k].page = 1; });
    render();
  });

  boot();
})();
</script>
</body>
